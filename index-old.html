<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AIFaceplant</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: rgba(15, 23, 42, 0.72);
        --card: #111827;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --accent: #7c3aed;
        --accent-2: #22c55e;
        --border: rgba(148, 163, 184, 0.18);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        font-family: Inter, "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at top left, rgba(124, 58, 237, 0.25), transparent 32%),
          radial-gradient(circle at bottom right, rgba(34, 197, 94, 0.22), transparent 28%),
          var(--bg);
        color: var(--text);
      }

      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 32px 20px;
      }

      .shell {
        width: min(760px, 100%);
        border: 1px solid var(--border);
        border-radius: 24px;
        background: var(--panel);
        backdrop-filter: blur(12px);
        box-shadow: 0 20px 50px rgba(15, 23, 42, 0.45);
        padding: 48px 32px;
      }

      .eyebrow {
        display: inline-block;
        padding: 6px 10px;
        border: 1px solid rgba(124, 58, 237, 0.55);
        border-radius: 999px;
        color: #d8b4fe;
        background: rgba(124, 58, 237, 0.1);
        letter-spacing: 0.08em;
        font-size: 11px;
        text-transform: uppercase;
        margin-bottom: 18px;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.5rem, 6vw, 5rem);
        line-height: 0.97;
        letter-spacing: -0.06em;
      }

      .tagline {
        margin: 18px 0 28px;
        color: var(--muted);
        font-size: 1.1rem;
        line-height: 1.6;
        max-width: 56ch;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
      }

      .button {
        display: inline-block;
        text-decoration: none;
        font-weight: 600;
        padding: 14px 20px;
        border-radius: 14px;
        transition: transform 0.2s ease, opacity 0.2s ease;
      }

      .button:hover {
        transform: translateY(-1px);
      }

      .button.primary {
        background: linear-gradient(135deg, var(--accent), #a855f7);
        color: white;
        box-shadow: 0 12px 28px rgba(124, 58, 237, 0.35);
      }

      .button.secondary {
        color: var(--text);
        background: rgba(148, 163, 184, 0.08);
        border: 1px solid var(--border);
      }

      .meta {
        margin-top: 28px;
        display: flex;
        flex-wrap: wrap;
        gap: 18px;
        color: var(--muted);
        font-size: 0.92rem;
      }

      .meta span {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent-2);
        box-shadow: 0 0 12px rgba(34, 197, 94, 0.8);
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <div class="eyebrow">AIFaceplant</div>
      <h1>Build smarter.<br />Ship faster.</h1>
      <p class="tagline">
        A minimal landing page for a modern AI product, focused on clarity, momentum,
        and a polished first impression.
      </p>

      <div class="actions">
        <a class="button primary" href="#">Get started</a>
        <a class="button secondary" href="#">Learn more</a>
      </div>

      <div class="meta">
        <span><i class="dot"></i> Minimal by design</span>
        <span><i class="dot"></i> AI-first workflow</span>
        <span><i class="dot"></i> Ready to launch</span>
      </div>
    </main>
  </body>
</html>
